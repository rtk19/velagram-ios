name: Release IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Configure service credentials
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          ./scripts/configure.sh
          python3 - <<'PY'
          import os, pathlib, plistlib
          pathlib.Path('Config/Local.xcconfig').write_text(''.join(k+' = '+os.environ.get(k,'')+'\n' for k in ['TMDB_READ_ACCESS_TOKEN','SUBDL_API_KEY']))
          pathlib.Path('Velagram/Resources/TelegramConfiguration.plist').write_bytes(plistlib.dumps({'api_id':int(os.environ.get('TELEGRAM_API_ID') or 0),'api_hash':os.environ.get('TELEGRAM_API_HASH','')}))
          PY
      - name: Build unsigned IPA
        run: |
          ./build-unsigned-ipa.sh
          cd build/unsigned
          shasum -a 256 Velagram-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Velagram-unsigned
          path: |
            build/unsigned/Velagram-unsigned.ipa
            build/unsigned/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Velagram $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/unsigned/Velagram-unsigned.ipa build/unsigned/SHA256SUMS.txt --clobber
