name: Velagram
options:
  bundleIdPrefix: com.refael
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: A97K2SS8D9
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -framework AppIntents"
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  MediaRuntime:
    path: Packages/MediaRuntime
  GoogleCastSDK:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  Velagram:
    type: application
    platform: iOS
    sources: [Velagram]
    dependencies:
      - package: MediaRuntime
        product: TDLibFramework
      - package: MediaRuntime
        product: VLCKit
      - package: GoogleCastSDK
        product: GoogleCastDynamic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refael.Velagram
        INFOPLIST_FILE: Velagram/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Velagram/Resources/Velagram.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [VelagramTests, VelagramUITests]
  VelagramTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VelagramTests]
    dependencies:
      - target: Velagram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refael.VelagramTests
        GENERATE_INFOPLIST_FILE: YES
  VelagramUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VelagramUITests
      - path: VelagramTests/Fixtures/TelegramInteraction.mkv
        buildPhase: resources
      - path: VelagramTests/Fixtures/TelegramNativePlayback.mp4
        buildPhase: resources
    dependencies:
      - target: Velagram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refael.VelagramUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Velagram
